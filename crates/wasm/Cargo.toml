[package]
name = "gba2cia-wasm"
description = "WebAssembly bindings used by the browser version of gba-to-3ds-cia."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
gba2cia-core.workspace = true
wasm-bindgen = "=0.2.130"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
