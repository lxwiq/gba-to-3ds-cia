name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            name: gba2cia-macos-arm64
          - os: macos-latest
            target: x86_64-apple-darwin
            name: gba2cia-macos-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            name: gba2cia-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            name: gba2cia-linux-arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            name: gba2cia-windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release -p gba2cia --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/${{ matrix.target }}/release/gba2cia.exe dist/${{ matrix.name }}.exe
          else
            cp target/${{ matrix.target }}/release/gba2cia dist/${{ matrix.name }}
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
