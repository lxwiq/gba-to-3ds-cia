[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/wasm"]

[workspace.package]
version = "1.0.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/lxwiq/gba-to-3ds-cia"

[workspace.dependencies]
gba2cia-core = { path = "crates/core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = "debuginfo"
